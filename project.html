<style>
	.projects{

width:100%;
padding:90px 8%;
background: pink;
}

.section-title{

text-align:center;
margin-bottom:60px;
}

.section-title h2{

color:#000000;
font-size:42px;
font-weight:700;
}

.section-title p{

color:#bdbdbd;
font-size:17px;
margin-top:15px;
}

.project-grid{

display:grid;
grid-template-columns:repeat(3,1fr);
gap:35px;
}

.project-card{


overflow:hidden;
transition:.4s;
}

.project-card:hover{

transform:translateY(-10px);
}

.project-card img{

width:100%;
height:270px;
object-fit:cover;
display:block;
}

.project-info{

padding:20px;
}

.project-info h3{

color:#fff;
margin-bottom:10px;
}

.project-info p{

color:#bdbdbd;
line-height:1.7;
}

/* Tablet */

@media(max-width:992px){

.project-grid{

grid-template-columns:repeat(2,1fr);

}

}

/* Mobile */

@media(max-width:768px){

.project-grid{

grid-template-columns:1fr;

}

.projects{

padding:60px 20px;

}

.section-title h2{

font-size:32px;

}

.project-card img{

height:240px;

}

}
